name: Supercontest cron

# Score refresh only. weekly-email, picks-reminder, tuesday-lock-cycle, and
# finalize-ats are triggered exclusively by precise cron-job.org pings now -
# GitHub Actions' schedule trigger is best-effort and can be delayed by
# hours, which is fine for "check scores often" but not for "lock lines at
# exactly 11:30am" or "never send an email at a random time." Score refresh
# is still self-gated in the app (kickoff time +/- a few hours), so pinging
# it on any imprecise schedule is harmless - it no-ops outside its window.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

env:
  BASE_URL: https://supercontest.onrender.com

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Score refresh
        run: |
          set -u
          QUERY=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && QUERY="?force=1"
          echo "== refresh-scores$QUERY =="
          curl -sf -X POST -H "X-CRON-TOKEN: ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/admin/internal/cron/refresh-scores$QUERY"
